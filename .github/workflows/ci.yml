name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pygame numpy
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: pixel-td --version

  deb:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lintian
      - run: ./packaging/debian/build-deb.sh
      - run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb
      - run: lintian --no-tag-display-limit dist/*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-td-deb
          path: dist/*.deb
